# Standard pre-commit hooks owned by dgrah50/gijq.
# Run locally with `pre-commit run` or automatically by Archangel's Gate (read strictly from `main`).
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: Check Go formatting
        entry: bash -c 'unfmt=$(gofmt -l "$@"); if [ -n "$unfmt" ]; then echo "Unformatted Go files:"; echo "$unfmt"; exit 1; fi' --
        language: system
        files: '\.go$'
      - id: go-vet
        name: Run go vet
        entry: go vet ./...
        language: system
        files: '\.go$'
        pass_filenames: false
      - id: ban-go-test-cheats
        name: Ban TestMain, init(), build tags, t.Skip, and //go:generate in changed files
        entry: bash -c 'if grep -nE "^[[:space:]]*(//go:build|// \+build|//go:generate|func[[:space:]]+TestMain\(|func[[:space:]]+init\()|\.(Skip|Skipf|SkipNow)\(" "$@"; then echo "Banned Go test/build directive detected"; exit 1; fi' --
        language: system
        files: '\.go$'
