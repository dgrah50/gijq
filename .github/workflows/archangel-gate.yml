name: Gate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # Only to label a machine-drafted `agent-draft/*` PR `agent-proposed`; nothing else in this job writes.
  issues: write
  pull-requests: write

env:
  ARCHANGEL_REPO: dgrah50/archangel
  # Pin to an immutable 40-char commit SHA of dgrah50/archangel.
  ARCHANGEL_GATE_SHA: db69bb7d1e47cebf9eb37e7782ead936613ae022

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - name: Classify PR (enforce Gate on factory/*, reject bot PRs on non-factory branches, pass-through human PRs)
        id: classify
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ "$HEAD_REPO" = "$BASE_REPO" ] && [[ "$HEAD_REF" == factory/* ]]; then
            echo "is_factory=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" = "$BASE_REPO" ] && [[ "$HEAD_REF" =~ ^agent-draft/[a-z0-9-]+-[0-9]+$ ]] && { [ "$AUTHOR_TYPE" = "Bot" ] || [[ "$AUTHOR_LOGIN" == *"[bot]" ]]; }; then
            # A machine-drafted skill/prompt/rubric change (correction loop). It is not a bugfix, so no red-on-base proof applies, and it
            # is never merged by the daemon: only the owner merges it, by hand. It is labelled below so it can never pass as a human PR.
            echo "Machine draft ($AUTHOR_LOGIN @ $HEAD_REF): classified is_draft, owner review required."
            echo "is_factory=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
          elif [ "$AUTHOR_TYPE" = "Bot" ] || [[ "$AUTHOR_LOGIN" == *"[bot]" ]]; then
            echo "ERROR: Bot-authored PR ($AUTHOR_LOGIN) on non-factory branch ($HEAD_REPO:$HEAD_REF) is forbidden." >&2
            exit 1
          else
            echo "Human non-factory or fork PR ($AUTHOR_LOGIN @ $HEAD_REPO:$HEAD_REF) — mechanical Gate pass-through."
            echo "is_factory=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Label machine drafts agent-proposed (owner review required)
        if: steps.classify.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create agent-proposed --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "Proposed by Archangel; the owner decides" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agent-proposed

      - name: Checkout PR merge ref with full history (no persisted credentials)
        if: steps.classify.outputs.is_factory == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js (for language-agnostic Archangel Gate CLI)
        if: steps.classify.outputs.is_factory == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Go (when target repository has go.mod)
        if: steps.classify.outputs.is_factory == 'true' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun (when target repository has bun.lock)
        if: steps.classify.outputs.is_factory == 'true' && hashFiles('bun.lock') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Setup Node dependencies (when target repository has bun.lock or package-lock.json)
        if: steps.classify.outputs.is_factory == 'true' && (hashFiles('bun.lock') != '' || hashFiles('package-lock.json') != '')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Never execute untrusted PR package.json lifecycle scripts; fail closed if package manifests changed.
          if [ -f bun.lock ]; then
            git diff --quiet "$BASE_SHA" HEAD -- package.json bun.lock || {
              echo "ERROR: package.json or bun.lock modified on factory PR" >&2
              exit 1
            }
            bun install --frozen-lockfile
          else
            git diff --quiet "$BASE_SHA" HEAD -- package.json package-lock.json || {
              echo "ERROR: package.json or package-lock.json modified on factory PR" >&2
              exit 1
            }
            npm ci --no-audit
          fi

      - name: Fetch pinned Archangel Gate bundle (zero npm ci, auth scrubbed before PR tests run)
        if: steps.classify.outputs.is_factory == 'true'
        env:
          ARCHANGEL_READ_TOKEN: ${{ secrets.ARCHANGEL_READ_TOKEN }}
        run: |
          if [[ ! "$ARCHANGEL_GATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: ARCHANGEL_GATE_SHA must be a pinned 40-character commit SHA (got: $ARCHANGEL_GATE_SHA)" >&2
            exit 2
          fi
          rm -rf "$RUNNER_TEMP/archangel-src"
          git init -q "$RUNNER_TEMP/archangel-src"
          git -C "$RUNNER_TEMP/archangel-src" remote add origin "https://github.com/${ARCHANGEL_REPO}.git"
          if [ -n "$ARCHANGEL_READ_TOKEN" ]; then
            AUTH_B64=$(printf 'x-access-token:%s' "$ARCHANGEL_READ_TOKEN" | base64 | tr -d '\n')
            git -C "$RUNNER_TEMP/archangel-src" -c "http.extraHeader=Authorization: Basic ${AUTH_B64}" fetch --depth=1 origin "$ARCHANGEL_GATE_SHA"
          else
            git -C "$RUNNER_TEMP/archangel-src" fetch --depth=1 origin "$ARCHANGEL_GATE_SHA"
          fi
          git -C "$RUNNER_TEMP/archangel-src" checkout -q FETCH_HEAD
          # Remove .git immediately so no auth metadata or git config lingers while PR tests execute.
          rm -rf "$RUNNER_TEMP/archangel-src/.git"

      - name: Run Archangel Mechanical Gate (repo-owned .pre-commit-config.yaml + .agents/archangel.json from base)
        if: steps.classify.outputs.is_factory == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          EXTRA_ARGS=()
          # Work class comes only from the branch name. The daemon alone chooses factory/feature-<n> or
          # factory/chore-<n> (from an owner-verified `class:feature` / `class:chore` issue label); the implementer
          # cannot name the pushed branch.
          if [[ "$HEAD_REF" =~ ^factory/(feature|chore)-[0-9]+$ ]]; then
            EXTRA_ARGS+=(--work-class "${BASH_REMATCH[1]}")
          fi
          if [[ "$HEAD_REF" =~ ^factory/revert-[0-9]+$ ]]; then
            git cat-file -e "${HEAD_SHA}^{commit}"
            REVERT_OF=$(git log -1 --format=%B "$HEAD_SHA" | sed -nE 's/^This reverts commit ([0-9a-f]{40})\..*/\1/p' | head -n 1)
            if [ -z "$REVERT_OF" ]; then
              echo "ERROR: factory/revert-* branch missing 'This reverts commit <40-char-sha>.' trailer" >&2
              exit 1
            fi
            EXTRA_ARGS+=(--revert-of "$REVERT_OF")
          fi
          node "$RUNNER_TEMP/archangel-src/bin/archangel-gate.mjs" \
            --repo . \
            --base "$BASE_SHA" \
            --head HEAD \
            --proof-head-sha "$HEAD_SHA" \
            "${EXTRA_ARGS[@]}"
